# Development database. Start with: pnpm db:up
name: atrium-dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
      POSTGRES_DB: atrium
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - atrium-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium -d atrium"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  atrium-dev-db:
