packages:
  - apps/*
  - packages/*
  - packs/*
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@playwright/test@1.64.0'
  - playwright-core@1.64.0
  - playwright@1.64.0
  - '@fastify/cookie@11.1.3'
  - '@fastify/multipart@10.1.3'
  - lucide-react@1.53.0
  - vite@8.3.4
# Security fixes for transitive dependencies (pnpm audit). pptxgenjs never loads image-size, and
# exceljs only uses uuid.v4, so the major-version jumps are safe.
overrides:
  image-size: ^2.0.3
  uuid: ^11.1.1
  sharp: ^0.35.5
